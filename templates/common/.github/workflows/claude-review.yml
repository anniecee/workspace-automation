name: Claude PR Review

# Reviews every new or updated pull request with the Claude subscription token.
# Needs the Claude GitHub App installed on this repo and a repository secret named
# CLAUDE_CODE_OAUTH_TOKEN (create the token with `claude setup-token`).
# Without the secret the job skips itself, so a fresh repo never shows a red check.
# If the subscription is out of usage, the run fails; nothing else is affected.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (fork PRs do not receive repository secrets).
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check for the Claude token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, skipping the Claude review."
          fi
      - uses: actions/checkout@v6
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read AGENTS.md and follow its hard rules. Check for
            correctness bugs, missing or weak tests, and style problems. Post inline comments for
            specific issues and one short summary comment. Be concise and skip nitpicks. Do not
            push commits or modify files.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
